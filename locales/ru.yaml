# Приветствие и общие команды
welcome: "Привет, %s! Я ShuggaBuddy — твой карманный помощник для контроля диабета 1 типа.\n\nИспользуй /help чтобы узнать, что я умею."
welcome_back: "С возвращением, %s!"
help: |
  Доступные команды:

  /start — начало работы, создание профиля
  /help — список команд
  /profile — твой профиль
  /setunits — выбрать единицы измерения (ммоль/л или мг/дл)
  /glucose <значение> — записать уровень сахара
  /last — последние 5 записей

